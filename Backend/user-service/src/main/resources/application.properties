spring.application.name=user-service
server.port=8081

# Local PostgreSQL (docker container user-service-postgres, host port 15432)
spring.datasource.url=jdbc:postgresql://localhost:15432/user_service
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema is managed by Flyway; Hibernate only validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
# dev 프로필(application-dev.properties)은 db/seed 를 추가로 적용한다
spring.flyway.locations=classpath:db/migration
# ddl-auto로 만들어진 DB를 조용히 baseline 처리해 마이그레이션이 건너뛰어지는 사고를 막는다
spring.flyway.baseline-on-migrate=false

# Redis (refresh token 저장, access token 블랙리스트)
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# JWT 서명 키 (RS256). PKCS#8 PEM 문자열이며 줄바꿈은 실제 개행 또는 백슬래시-n 리터럴 모두 허용.
# 비어 있으면 기동 시 임시 키를 생성한다 (로컬 전용: 재시작 시 기존 토큰 무효, 다른 서비스가 검증 불가).
# 생성: openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out jwt-private.pem
# 공개키는 생략 시 개인키에서 유도되며 /.well-known/jwks.json 으로 배포된다.
jwt.private-key=${JWT_PRIVATE_KEY:}
jwt.public-key=${JWT_PUBLIC_KEY:}
# 만료 시간(ms): access 15분, refresh 7일
jwt.access-expiration=900000
jwt.refresh-expiration=604800000

# 쿠키 보안 옵션. https 운영: COOKIE_SECURE=true. 프론트가 다른 사이트면 COOKIE_SAME_SITE=None (+secure 필수, CSRF 방어 필요)
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

# CORS 허용 origin (쉼표 구분, 와일드카드 불가). 운영에서는 실제 프론트 도메인으로 교체
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# 로그인 실패 제한: failure-window 안에 max-failures 회 실패하면 lock-duration 동안 잠금 (Redis 기반)
app.login.max-failures=5
app.login.failure-window=10m
app.login.lock-duration=15m


# Eureka
## 유레카 서버 주소
eureka.client.service-url.defaultZone=${EUREKA_URL:http://admin:1234@localhost:8761/eureka}
## 나를 Eureka에 등록할지
eureka.client.register-with-eureka=true
## Eureka에서 다른 서비스 목록을 받아올지, 다른 서비스 호출 시 필수!
eureka.client.fetch-registry=true
## 컴퓨터 이름(hostname) 대신 IP로 등록, Docker 환경에서 다른 서비스가 나를 못 찾는 문제 방지
eureka.instance.prefer-ip-address=true


# HTTP로 상태 확인 기능만 제공
management.endpoints.web.exposure.include=health

# 응답에는 상세 정보 대신 전체 상태만 표시
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

