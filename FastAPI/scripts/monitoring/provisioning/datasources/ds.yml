# 팀 Grafana와 같은 uid(prometheus / ai-db) → 대시보드 JSON을 그대로 쓸 수 있음
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://host.docker.internal:19091
    isDefault: true
  - name: ai-db
    uid: ai-db
    type: grafana-postgresql-datasource
    access: proxy
    url: host.docker.internal:5433
    user: nexa_admin
    jsonData:
      database: nexa_dev
      sslmode: disable
      postgresVersion: 1700
    secureJsonData:
      password: $DB_PASSWORD       # 컨테이너 시작할 때 환경변수로 넣음 (파일에 안 적음)