spring.application.name=eureka-server

server.port=${SERVER_PORT:8761}

# Eureka 접속 계정 (.env / 환경변수로 주입)
spring.security.user.name=${EUREKA_USER}
spring.security.user.password=${EUREKA_PASSWORD}

eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Self-Preservation 모드 비활성화
# 우리 서비스는 인스턴스 수가 적어(6~7개) 서비스 1개만 비정상 종료돼도 모드가 켜져, 죽은 인스턴스가 목록에 계속 남는 문제가 발생할 수 있음
eureka.server.enable-self-preservation=false

# defaultZone을 따로 설정하지 않은 단일 Eureka 구성 시 필요
# (자기 자신을 peer로 인식해 복제 요청을 보내다 Security에 막혀 401이 반복되는 문제 방지)
eureka.instance.hostname=localhost

# Health check
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never