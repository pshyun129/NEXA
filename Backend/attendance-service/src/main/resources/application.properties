spring.application.name=attendance-service
server.port=${SERVER_PORT:8084}

# Config Server
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

# Eureka
## 유레카 서버 주소
eureka.client.service-url.defaultZone=${EUREKA_URL:http://admin:1234@localhost:8761/eureka}
## 나를 Eureka에 등록할지
eureka.client.register-with-eureka=true
## Eureka에서 다른 서비스 목록을 받아올지, 다른 서비스 호출 시 필수!
eureka.client.fetch-registry=true
## 컴퓨터 이름(hostname) 대신 IP로 등록, Docker 환경에서 다른 서비스가 나를 못 찾는 문제 방지
eureka.instance.prefer-ip-address=true

# 토큰 검증 공개키 (user-service JWKS)
nexa.security.jwks-uri=${JWT_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

# 타 서비스 주소 (Eureka 서비스 이름, 로드밸런서가 실제 주소로 바꾼다. 로컬에서도 Eureka가 떠 있어야 함)
attendance.clients.approval.base-url=${APPROVAL_SERVICE_URL:http://approval-service}
attendance.clients.leave.base-url=${LEAVE_SERVICE_URL:http://leave-service}
attendance.clients.user.base-url=${USER_SERVICE_URL:http://user-service}

# Kafka (결재 결과 이벤트 수신)
## 로컬 기본값: approval-service compose 의 kafka (호스트 포트 19092)
## 공용 환경: config-server(nexa-config application.yml)의 값(kafka:9092)이 이 값을 덮어쓴다
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
## 서비스마다 컨슈머 그룹이 따로라 결재 결과를 휴가 서비스와 각자 받는다
spring.kafka.consumer.group-id=attendance-service
## 처음 붙을 때 토픽의 처음부터 읽는다 (결과 반영은 중복에 안전)
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
## 처리에 실패한 메시지를 DLT 토픽으로 옮길 때 쓰는 프로듀서
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# DB
spring.datasource.url=jdbc:postgresql://localhost:5433/nexa_attendance
spring.datasource.username=nexa_attendance_app
spring.datasource.password=${ATTENDANCE_DB_PASSWORD}

# JPA - 스키마는 Flyway가 관리하고 Hibernate는 검증만
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
# dev 프로필(application-dev.properties)은 db/seed 를 추가로 적용한다
spring.flyway.locations=classpath:db/migration
# ddl-auto로 만들어진 DB를 baseline 처리해 마이그레이션이 건너뛰어지는 사고 방지
spring.flyway.baseline-on-migrate=false

# Health check
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
