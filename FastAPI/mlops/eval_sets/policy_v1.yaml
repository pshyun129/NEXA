  - {q: 거래처 접대비 사전 승인 기준, doc: EXP, expect: [EXP-11]}
  - {q: 택시를 타도 되는 경우, doc: EXP, expect: [EXP-12]}
  - {q: 간이영수증으로 증빙할 수 있는 금액, doc: EXP, expect: [EXP-14]}
  - {q: 경비 정산은 언제까지 신청해야 하나요, doc: EXP, expect: [EXP-15]}
  - {q: 법인카드를 잃어버리면 어떻게 하나요, doc: EXP, expect: [EXP-5]}
  - {q: 당일 출장 일비는 얼마인가요, doc: TRV, expect: [TRV-7]}
  - {q: 지방 출장 숙박비 한도, doc: TRV, expect: [TRV-8]}
  - {q: 해외 출장 숙박비는 얼마까지, doc: TRV, expect: [TRV-11]}
  - {q: 반차는 몇 시부터 몇 시까지, doc: LEV, expect: [LEV-9]}
  - {q: 연차는 다음 해로 며칠까지 넘길 수 있나요, doc: LEV, expect: [LEV-11]}
  - {q: 한 주에 초과근무 최대 몇 시간, doc: LEV, expect: [LEV-6]}
  # 규정에 답이 없는 질문 (기권해야 정답)
  - {q: 회사 주차장 정기권 신청 방법, doc: null, expect: []}
  - {q: 사내 동호회 지원금은 얼마인가요, doc: null, expect: []}
  - {q: 명함은 어디서 신청하나요, doc: null, expect: []}
