plugins {
	id 'java-library'
	id 'maven-publish'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ssafy.nexa'
// 배포 버전. 올릴 때는 이 값을 바꾸고 같은 번호로 nexa-security-v<버전> 태그를 push 한다
version = '1.1.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
	withSourcesJar()
}

repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		mavenBom 'org.springframework.boot:spring-boot-dependencies:4.1.1'
	}
}

dependencies {
	// 사용하는 서비스에 Spring Security + 리소스 서버(JWT 검증)가 함께 들어가도록 api 로 노출
	api 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	compileOnly 'jakarta.servlet:jakarta.servlet-api'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

publishing {
	publications {
		maven(MavenPublication) {
			from components.java
			// Boot BOM 으로 맞춘 버전을 pom 에 그대로 적는다 (사용하는 쪽이 BOM 없이도 같은 버전을 받게)
			versionMapping {
				usage('java-api') { fromResolutionOf('runtimeClasspath') }
				usage('java-runtime') { fromResolutionResult() }
			}
		}
	}
	repositories {
		// CI(태그 파이프라인)에서만 올린다. 같은 프로젝트의 Package Registry 를 Job-Token 으로 사용
		if (System.getenv('CI_JOB_TOKEN')) {
			maven {
				name = 'GitLab'
				url = "${System.getenv('CI_API_V4_URL')}/projects/${System.getenv('CI_PROJECT_ID')}/packages/maven"
				credentials(HttpHeaderCredentials) {
					name = 'Job-Token'
					value = System.getenv('CI_JOB_TOKEN')
				}
				authentication {
					header(HttpHeaderAuthentication)
				}
			}
		}
	}
}
