verify-fastapi:
  stage: build
  image: python:3.11-slim

  tags:
    - nexa-ci

  services:
    - name: postgres:17-alpine
      alias: postgres

  variables:
    POSTGRES_DB: nexa_ai_test
    POSTGRES_USER: nexa_ai_test
    POSTGRES_PASSWORD: ci_test_password

    DB_HOST: postgres
    DB_PORT: "5432"
    DB_NAME: nexa_ai_test
    DB_USER: nexa_ai_test
    DB_PASSWORD: ci_test_password

    EUREKA_SERVER_URL: ""
    LLM_TEST_API_ENABLED: "false"
    UPLOAD_DIR: /tmp/nexa-ai-uploads

    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

  cache:
    key:
      files:
        - FastAPI/requirements.txt
      prefix: fastapi-py311
    paths:
      - .cache/pip/

  script:
    - cd FastAPI
    - python -m pip install -r requirements.txt
    - python -m pip check
    - |
      python - <<'PY'
      import os
      import time
      import psycopg

      for attempt in range(30):
          try:
              with psycopg.connect(
                  host=os.environ["DB_HOST"],
                  port=os.environ["DB_PORT"],
                  dbname=os.environ["DB_NAME"],
                  user=os.environ["DB_USER"],
                  password=os.environ["DB_PASSWORD"],
                  connect_timeout=3,
              ) as conn:
                  conn.execute("SELECT 1")
              break
          except psycopg.OperationalError:
              if attempt == 29:
                  raise
              time.sleep(2)

      from pathlib import Path
      from fastapi.testclient import TestClient
      from main import app

      upload_dir = Path(os.environ["UPLOAD_DIR"])
      upload_dir.mkdir(parents=True, exist_ok=True)
      probe = upload_dir / "ci-write-check.txt"
      probe.write_text("ok")
      probe.unlink()

      with TestClient(app) as client:
          response = client.get("/health")
          assert response.status_code == 200, response.text
          assert response.json() == {"status": "ok"}, response.text

      print("FastAPI startup, database initialization and health check passed")
      PY

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &fastapi_changes
        - FastAPI/**/*
        - .gitlab/ci/fastapi.yml
        - compose.dev.yml
        - infra/compose/ai.yml
        - infra/compose/data.yml
      when: on_success
      allow_failure: false

    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
      changes: *fastapi_changes
      when: on_success
      allow_failure: false

    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true


deploy-fastapi-dev:
  stage: deploy

  tags:
    - nexa-dev-deploy

  resource_group: nexa-development
  interruptible: false
  timeout: 20m

  environment:
    name: development/fastapi
    url: https://nexa-erp.duckdns.org

  variables:
    GIT_STRATEGY: clone

  needs:
    - job: verify-fastapi
      artifacts: false
    - job: deploy-eureka-dev
      optional: true
      artifacts: false

  script:
    - |
      set -euo pipefail
      cd "$CI_PROJECT_DIR"

      test -r /opt/nexa-dev/.env

      compose() {
        docker compose \
          --env-file /opt/nexa-dev/.env \
          -p nexa \
          -f compose.dev.yml "$@"
      }

      compose config --quiet
      compose build fastapi

      compose up -d --no-deps --no-build \
        --wait --wait-timeout 180 fastapi

      compose ps fastapi

  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
      changes: *fastapi_changes
      when: on_success
      allow_failure: false