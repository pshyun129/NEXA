build-eureka:
  extends: .gradle-cache
  stage: build
  image: eclipse-temurin:21-jdk

  tags:
    - nexa-ci

  variables:
    EUREKA_USER: ci_eureka
    EUREKA_PASSWORD: ci_test_password

  script:
    - cd Backend/eureka-server
    - |
      if [ "$CI_PIPELINE_SOURCE" = "push" ] && [ "$CI_COMMIT_BRANCH" = "develop" ]; then
        echo "develop: 테스트 생략, JAR 생성"
        bash gradlew --no-daemon bootJar -x test
      else
        echo "MR 또는 수동 실행: 테스트 및 JAR 생성"
        bash gradlew --no-daemon test bootJar
      fi

  artifacts:
    when: always
    expire_in: 2 days
    paths:
      - Backend/eureka-server/build/libs/*.jar
    reports:
      junit: Backend/eureka-server/build/test-results/test/TEST-*.xml

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &eureka_changes
        - Backend/eureka-server/**/*
        - .gitlab/ci/eureka.yml
        - .gitlab/ci/deploy.yml
        - .gitlab/ci/gradle.yml
        - compose.dev.yml
        - infra/compose/platform.yml
        - infra/compose/data.yml
        - infra/docker/Dockerfile.ci
      when: on_success
      allow_failure: false

    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
      changes: *eureka_changes
      when: on_success
      allow_failure: false

    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true

deploy-eureka-dev:
  extends: .deploy-dev

  needs:
    - build-eureka

  variables:
    DEPLOY_SERVICE: eureka-server

  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
      changes: *eureka_changes
      when: on_success
      allow_failure: false