build-gateway:
  extends: .gradle-cache
  stage: build
  image: eclipse-temurin:21-jdk

  tags:
    - nexa-ci

  variables:
    SPRING_CONFIG_LOCATION: classpath:/gateway-ci.yml

  script:
    - cd Backend/gateway-service
    - |
      if [ "$CI_PIPELINE_SOURCE" = "push" ] && [ "$CI_COMMIT_BRANCH" = "develop" ]; then
        echo "develop: 테스트 생략, JAR 생성"
        bash gradlew --no-daemon bootJar -x test
      else
        echo "MR 또는 수동 실행: 테스트 및 JAR 생성"
        bash gradlew --no-daemon test bootJar
      fi

  artifacts:
    when: always
    expire_in: 2 days
    paths:
      - Backend/gateway-service/build/libs/*.jar
    reports:
      junit: Backend/gateway-service/build/test-results/test/TEST-*.xml

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &gateway_changes
        - Backend/gateway-service/**/*
        - .gitlab/ci/gateway.yml
        - .gitlab/ci/deploy.yml
        - .gitlab/ci/gradle.yml
        - compose.dev.yml
        - infra/compose/platform.yml
        - infra/compose/data.yml
        - infra/docker/Dockerfile.ci
      when: on_success
      allow_failure: false

    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
      changes: *gateway_changes
      when: on_success
      allow_failure: false

    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true

deploy-gateway-dev:
  extends: .deploy-dev

  needs:
    - job: build-gateway
    - job: deploy-config-dev
      optional: true
    - job: deploy-eureka-dev
      optional: true
    - job: deploy-user-dev
      optional: true

  variables:
    DEPLOY_SERVICE: gateway-service

  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
      changes: *gateway_changes
      when: on_success
      allow_failure: false