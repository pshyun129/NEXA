services:
  postgres:
    image: postgres:17-alpine

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


    environment:
      POSTGRES_DB: nexa_dev
      POSTGRES_USER: nexa_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?USER_DB_PASSWORD is required}
      LEAVE_DB_PASSWORD: ${LEAVE_DB_PASSWORD:?LEAVE_DB_PASSWORD is required}
      APPROVAL_DB_PASSWORD: ${APPROVAL_DB_PASSWORD:?APPROVAL_DB_PASSWORD is required}
      ATTENDANCE_DB_PASSWORD: ${ATTENDANCE_DB_PASSWORD:?ATTENDANCE_DB_PASSWORD is required}
      PAYROLL_DB_PASSWORD: ${PAYROLL_DB_PASSWORD:?PAYROLL_DB_PASSWORD is required}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?MIGRATION_DB_PASSWORD is required}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:?AI_DB_PASSWORD is required}

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  redis:
    image: redis:7-alpine
    restart: unless-stopped

    environment:
      REDIS_USER_SERVICE_PASSWORD: ${REDIS_USER_SERVICE_PASSWORD:?REDIS_USER_SERVICE_PASSWORD is required}
      REDIS_GATEWAY_PASSWORD: ${REDIS_GATEWAY_PASSWORD:?REDIS_GATEWAY_PASSWORD is required}

    entrypoint: ["/bin/sh", "/usr/local/bin/start-redis.sh"]

    volumes:
      - ./infra/redis/start-redis.sh:/usr/local/bin/start-redis.sh:ro

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  # 결재 결과 이벤트 브로커 (approval → leave·attendance). KRaft 단일 노드, 컨테이너 네트워크 안에서만 접속
  # 서비스들은 config-server(nexa-config application.yml)의 spring.kafka.bootstrap-servers=kafka:9092 로 접속
  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # 토픽은 approval-service 가 기동할 때 만든다
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # 개발 서버 메모리 절약 (기본 1GB)
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

    volumes:
      - kafka-data:/var/lib/kafka/data

    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


volumes:
  postgres-data:
  kafka-data: