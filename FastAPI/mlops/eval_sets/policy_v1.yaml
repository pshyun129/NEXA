# 규정 RAG 평가셋 v1 (사람이 정답을 붙임, Git에 포함)
# 기준일: 2026-11-05 (경과일·요일 계산이 실행 날짜에 따라 바뀌지 않게 고정)
#
# retrieval: 검색 질문 → 정답 조항 (빈 목록 = 규정에 답이 없음 → 기권해야 정답)
# cases    : 영수증 검토 → 기대 판정 (목록이면 그중 하나면 정답)
#   clauses: 조항별 기대 판정 (중요한 조항만)   needs: needed_facts에 꼭 들어가야 하는 정보
#   기대 판정에 '준수'가 없는데 '준수'가 나오면 = 잘못된 준수 (그중 위반 케이스면 놓친 위반) → 게이트에서 0건이어야 함
today: 2026-11-05

