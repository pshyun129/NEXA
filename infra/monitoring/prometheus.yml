global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: approval-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["approval-service:8083"]

  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: ai-service
    metrics_path: /metrics
    static_configs:
      - targets: [ "fastapi:8086" ]