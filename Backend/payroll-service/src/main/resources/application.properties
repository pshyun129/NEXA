spring.application.name=payroll-service
server.port=${SERVER_PORT:8085}

# Config Server
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

# Eureka
## 유레카 서버 주소
eureka.client.service-url.defaultZone=${EUREKA_URL:http://admin:1234@localhost:8761/eureka}
## 나를 Eureka에 등록할지
eureka.client.register-with-eureka=true
## Eureka에서 다른 서비스 목록을 받아올지, 다른 서비스 호출 시 필수!
eureka.client.fetch-registry=true
## 컴퓨터 이름(hostname) 대신 IP로 등록, Docker 환경에서 다른 서비스가 나를 못 찾는 문제 방지
eureka.instance.prefer-ip-address=true

# 타 서비스 주소 (Eureka 서비스 이름, 로드밸런서가 실제 주소로 바꾼다. 로컬에서도 Eureka가 떠 있어야 함)
payroll.clients.attendance.base-url=${ATTENDANCE_SERVICE_URL:http://attendance-service}
payroll.clients.user.base-url=${USER_SERVICE_URL:http://user-service}

# 토큰 검증 공개키 (user-service JWKS)
nexa.security.jwks-uri=${JWT_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
# migration-service 는 토큰 없이 이관 내부 API를 부른다. gateway 에 /internal 라우트가 없어 내부망에서만 닿는다
nexa.security.permit-urls=/actuator/health,/error,/internal/v1/pay/migration/**

# DB
spring.datasource.url=jdbc:postgresql://localhost:5433/nexa_payroll
spring.datasource.username=nexa_payroll_app
spring.datasource.password=${PAYROLL_DB_PASSWORD}

# JPA - 스키마는 Flyway가 관리하고 Hibernate는 검증만
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
# dev 프로필(application-dev.properties)은 db/seed 를 추가로 적용한다
spring.flyway.locations=classpath:db/migration
# ddl-auto로 만들어진 DB를 baseline 처리해 마이그레이션이 건너뛰어지는 사고 방지
spring.flyway.baseline-on-migrate=false

# Health check
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never