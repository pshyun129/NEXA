spring.application.name=approval-service
server.port=8083

# Config Server. 공용 환경에서는 Kafka 주소(spring.kafka.bootstrap-servers) 등을 여기서 받는다
# optional: config-server 가 없으면(로컬) 이 파일의 값만으로 뜬다
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

# Local PostgreSQL (docker container approval-service-postgres, host port 15433)
spring.datasource.url=jdbc:postgresql://localhost:15433/approval_service
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema is managed by Flyway; Hibernate only validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true


# Eureka
## 유레카 서버 주소
eureka.client.service-url.defaultZone=${EUREKA_URL:http://admin:1234@localhost:8761/eureka}
## 나를 Eureka에 등록할지
eureka.client.register-with-eureka=true
## Eureka에서 다른 서비스 목록을 받아올지, 다른 서비스 호출 시 필수!
eureka.client.fetch-registry=true
## 컴퓨터 이름(hostname) 대신 IP로 등록, Docker 환경에서 다른 서비스가 나를 못 찾는 문제 방지
eureka.instance.prefer-ip-address=true

# HTTP로 상태 확인과 Prometheus 메트릭만 제공
management.endpoints.web.exposure.include=health,prometheus
## 모든 메트릭에 서비스 이름 태그 (여러 서비스를 한 Prometheus 로 모을 때 구분)
management.metrics.tags.application=${spring.application.name}

# 응답에는 상세 정보 대신 전체 상태만 표시
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

nexa.security.jwks-uri=${JWT_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
## 토큰 없이 열 경로. 지정하면 기본값(/actuator/health, /error)을 대체하므로 함께 적는다
## /actuator/prometheus: Prometheus 가 토큰 없이 수집. 공용 환경에선 포트가 127.0.0.1 에만 열리고 gateway 가 /actuator 를 라우팅하지 않음
nexa.security.permit-urls=/actuator/health,/error,/actuator/prometheus

# user-service 호출 (결재선 사원 존재·재직 확인)
## Eureka 서비스 이름. 로드밸런서가 실제 주소로 바꾸므로 로컬에서도 Eureka와 user-service가 떠 있어야 한다
app.user-service.base-url=${USER_SERVICE_URL:http://user-service}
## 트랜잭션 안에서 호출하므로 짧게. 넘으면 503 APPROVAL_017
app.user-service.connect-timeout=1s
app.user-service.read-timeout=2s

# Kafka (결재 결과 이벤트 발행)
## 로컬 기본값: approval-service compose 의 kafka (호스트 포트 19092)
## 공용 환경: config-server(nexa-config application.yml)의 값(kafka:9092)이 이 값을 덮어쓴다
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
## 아웃박스 payload 가 이미 JSON 문자열이라 문자열로 그대로 보낸다
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
## 리더와 동기화된 복제본이 모두 저장해야 성공으로 본다
spring.kafka.producer.acks=all
## 프로듀서가 재전송해도 브로커에 중복 저장되지 않게 한다
spring.kafka.producer.properties.enable.idempotence=true
## 브로커가 없을 때 send() 가 막혀 있는 최대 시간 (기본 60초 → 발행기가 오래 멈추지 않게)
spring.kafka.producer.properties.max.block.ms=5000
## 요청 하나의 응답 대기, 전송 성공/실패를 확정하는 최대 시간 (delivery >= request + linger)
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
## 기동 시 토픽 생성(KafkaAdmin)이 브로커를 기다리는 시간. 기본값이면 브로커가 없을 때 기동이 50초까지 늘어
## healthcheck(start_period 40s)를 넘긴다. 줄여도 브로커가 없으면 토픽 생성만 건너뛰고 앱은 뜬다 (14초 확인)
spring.kafka.admin.operation-timeout=5s
spring.kafka.admin.properties.default.api.timeout.ms=5000
spring.kafka.admin.properties.request.timeout.ms=5000

# 아웃박스 발행기: 이전 실행이 끝나고 몇 ms 뒤 다시 실행할지. 테스트는 app.outbox.scheduler.enabled=false
app.outbox.publish-interval=1000
## 발행 지연 점검 주기(ms)와 기준. 가장 오래된 미발행 이벤트가 기준 시간을 넘기면 ERROR 로그
app.outbox.monitor-interval=60000
app.outbox.alert-threshold=5m


# 위임전결 규정 기준값 (결재선 자동 결정). 이 값을 넘으면 한 단계 위가 전결권자가 된다
## 휴가: 일수가 이 값 이상이면 본부장
app.approval-policy.leave-division-days=5
## 초과근무: 그 달 누적(분)이 이 값을 넘으면 본부장 (12시간)
app.approval-policy.overtime-division-monthly-minutes=720
## 일반 기안: 금액(원)이 넘으면 본부장 / 대표이사
app.approval-policy.general-division-amount=1000000
app.approval-policy.general-company-amount=10000000
