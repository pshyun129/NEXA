
spring:
  application:
    name: gateway-service

  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"

  cloud:
    config:
      username: config-client
      password: ${CONFIG_SERVER_PASSWORD}

    gateway:
      server:
        webflux:
          metrics:
            enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      show-components: never